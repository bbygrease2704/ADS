{% extends 'layout.html' %}

{% block title %}Login | BUENA VISTA GAS{% endblock %}
{% block auth_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-mark large">BV</div>
            <div>
                <h1>BUENA VISTA</h1>
                <span>Gas & Servicios</span>
            </div>
        </div>

        <h2>Iniciar sesión</h2>
        <p>Accede al panel de gestión de clientes, ventas y atención.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <label class="field-label" for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="admin" required>

            <label class="field-label" for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="primary-button full">Entrar al sistema</button>
        </form>
        <div class="login-footer">
            <small>Usuario demo: admin</small>
            <small>Contraseña: admin123</small>
        </div>
    </div>
</div>
{% endblock %}
