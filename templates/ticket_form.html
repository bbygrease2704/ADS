{% extends 'layout.html' %}

{% block title %}{% if mode == 'editar' %}Editar caso{% else %}Nuevo caso{% endif %} | BUENA VISTA GAS{% endblock %}
{% block page_title %}{% if mode == 'editar' %}Editar caso{% else %}Nuevo caso{% endif %}{% endblock %}

{% block content %}
<section class="panel-card form-card">
    <form method="POST">
        <div class="form-grid">
            <div>
                <label>Cliente</label>
                <select name="cliente_id" required>
                    <option value="">Seleccionar cliente</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id }}" {% if ticket.cliente_id == cliente.id %}selected{% endif %}>{{ cliente.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Título</label>
                <input type="text" name="titulo" value="{{ ticket.titulo or '' }}" required>
            </div>
            <div>
                <label>Prioridad</label>
                <select name="prioridad">
                    <option value="baja" {% if ticket.prioridad == 'baja' %}selected{% endif %}>Baja</option>
                    <option value="media" {% if ticket.prioridad == 'media' %}selected{% endif %}>Media</option>
                    <option value="alta" {% if ticket.prioridad == 'alta' %}selected{% endif %}>Alta</option>
                </select>
            </div>
            <div>
                <label>Responsable</label>
                <input type="text" name="responsable" value="{{ ticket.responsable or 'Equipo BUENA VISTA' }}">
            </div>
            <div class="full-width">
                <label>Descripción</label>
                <textarea name="descripcion" rows="5" required>{{ ticket.descripcion or '' }}</textarea>
            </div>
            <div>
                <label>Estado</label>
                <select name="estado">
                    <option value="abierto" {% if ticket.estado == 'abierto' %}selected{% endif %}>Abierto</option>
                    <option value="en proceso" {% if ticket.estado == 'en proceso' %}selected{% endif %}>En proceso</option>
                    <option value="cerrado" {% if ticket.estado == 'cerrado' %}selected{% endif %}>Cerrado</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('tickets') }}" class="secondary-button">Cancelar</a>
            <button type="submit" class="primary-button">Guardar</button>
        </div>
    </form>
</section>
{% endblock %}
