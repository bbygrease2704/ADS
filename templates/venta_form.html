{% extends 'layout.html' %}

{% block title %}{% if mode == 'editar' %}Editar venta{% else %}Nueva venta{% endif %} | BUENA VISTA GAS{% endblock %}
{% block page_title %}{% if mode == 'editar' %}Editar venta{% else %}Nueva venta{% endif %}{% endblock %}

{% block content %}
<section class="panel-card form-card">
    <form method="POST">
        <div class="form-grid">
            <div>
                <label>Cliente</label>
                <select name="cliente_id" required>
                    <option value="">Seleccionar cliente</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id }}" {% if venta.cliente_id == cliente.id %}selected{% endif %}>{{ cliente.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Producto</label>
                <input type="text" name="producto" value="{{ venta.producto or '' }}" required>
            </div>
            <div>
                <label>Cantidad</label>
                <input type="number" name="cantidad" min="1" value="{{ venta.cantidad or 1 }}" required>
            </div>
            <div>
                <label>Total</label>
                <input type="number" step="0.01" name="total" value="{{ venta.total or 0 }}" required>
            </div>
            <div>
                <label>Método de pago</label>
                <select name="metodo_pago">
                    <option value="efectivo" {% if venta.metodo_pago == 'efectivo' %}selected{% endif %}>Efectivo</option>
                    <option value="tarjeta" {% if venta.metodo_pago == 'tarjeta' %}selected{% endif %}>Tarjeta</option>
                    <option value="yape" {% if venta.metodo_pago == 'yape' %}selected{% endif %}>Yape</option>
                </select>
            </div>
            <div>
                <label>Fecha de venta</label>
                <input type="date" name="fecha_venta" value="{{ venta.fecha_venta or '' }}" required>
            </div>
            <div>
                <label>Estado</label>
                <select name="estado">
                    <option value="completado" {% if venta.estado == 'completado' %}selected{% endif %}>Completado</option>
                    <option value="pendiente" {% if venta.estado == 'pendiente' %}selected{% endif %}>Pendiente</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('ventas') }}" class="secondary-button">Cancelar</a>
            <button type="submit" class="primary-button">Guardar</button>
        </div>
    </form>
</section>
{% endblock %}
